  <template id="doc-overview">
    <p class="docs-kicker">Get started</p>
    <h1>Overview</h1>
    <p class="docs-intro">These pages explain how to use your course key, call the course API, run TPU sessions, and set up your project group.</p>
    <h2 id="quickstart">Quickstart</h2>
    <ol class="docs-steps">
      <li>
        <p>Find your course key in your key email. Open <a href="#/">My usage</a> and paste the key to see your budget.</p>
      </li>
      <li>
        <p>Save the key in an environment variable. Keep it out of your code.</p>
        <pre data-lang="Shell"><code>export ECE661_API_KEY="your course key"</code></pre>
      </li>
      <li>
        <p>See the models you can call on your <a href="#/">My usage</a> page.</p>
      </li>
      <li>
        <p>Install the <code>ece661</code> command.</p>
        <pre data-lang="Shell"><code>curl -fsSL <span data-docs="origin">https://&lt;host&gt;</span>/broker/cli/install.sh | sh</code></pre>
        <p>Open a new terminal, then sign in. Paste your course key at the hidden prompt.</p>
        <pre data-lang="Shell"><code>ece661 login</code></pre>
      </li>
      <li>
        <p>Register your SSH key and start a one-chip TPU session for 4 hours.</p>
        <pre data-lang="Shell"><code>ece661 ssh-key add ~/.ssh/id_ed25519.pub
ece661 compute start --shape v6e-1 --hours 4</code></pre>
      </li>
    </ol>
    <h2 id="course-key">Your course key</h2>
    <p>You get a personal course key by email. It works for the course API, the <code>ece661</code> command, and the portal pages.</p>
    <p>Open <a href="#/">My usage</a> and paste your key to see your budget, your spend, the models you can call, and your compute sessions. The portal does not save your key.</p>
    <div class="callout warning" role="note"><p class="callout-title">Warning</p><p>Never share your course key. Do not paste it into code you commit, chat messages, or screenshots.</p></div>

  <template id="doc-api">
    <p class="docs-kicker">Guides</p>
    <h1>Course API</h1>
    <p class="docs-intro">The course API is OpenAI-compatible. Any OpenAI client works with your course key and the course base URL.</p>
    <h2 id="base-url">Base URL</h2>
    <pre data-lang="Text"><code><span data-docs="origin">https://&lt;host&gt;</span>/api/v1</code></pre>
    <p>You can also use <code><span data-docs="origin">https://&lt;host&gt;</span>/api</code>. Every endpoint works with or without <code>/v1</code>.</p>
    <h2 id="authentication">Authentication</h2>
    <p>Send your course key as a bearer token in the <code>Authorization</code> header.</p>
    <pre data-lang="HTTP"><code>Authorization: Bearer YOUR_COURSE_KEY</code></pre>
    <p>Keep the key in an environment variable, not in your code.</p>
    <pre data-lang="Shell"><code>export ECE661_API_KEY="your course key"</code></pre>
    <h2 id="endpoints">Endpoints</h2>
    <p>Paths are relative to the base URL.</p>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Method</th><th scope="col">Path</th><th scope="col">Description</th></tr></thead>
      <tbody>
        <tr><td><code>POST</code></td><td><code>/chat/completions</code></td><td>Chat responses, including streaming</td></tr>
        <tr><td><code>POST</code></td><td><code>/embeddings</code></td><td>Text embeddings</td></tr>
        <tr><td><code>POST</code></td><td><code>/images/generations</code></td><td>Image generation</td></tr>
        <tr><td><code>GET</code></td><td><code>/models</code></td><td>The models your key can call</td></tr>
      </tbody>
    </table></div>
    <h2 id="models">Models</h2>
    <p>Your <a href="#/">My usage</a> page lists the models you can call, with their prices. Put the model name in the <code>model</code> field of a request.</p>
    <div class="callout note" role="note"><p class="callout-title">Note</p><p>The model list can change during the semester. Check My usage or call <code>/models</code> instead of hardcoding a list.</p></div>
    <h2 id="python">Python example</h2>
    <p>Install the <code>openai</code> package. Then run:</p>
    <pre data-lang="Python"><code>import os
from openai import OpenAI

client = OpenAI(
    base_url="<span data-docs="origin">https://&lt;host&gt;</span>/api/v1",
    api_key=os.environ["ECE661_API_KEY"],
)
response = client.chat.completions.create(
    model="MODEL_NAME",
    messages=[{"role": "user", "content": "Hello!"}],
)
print(response.choices[0].message.content)</code></pre>
    <p>Replace <code>MODEL_NAME</code> with a model from your My usage page. My usage also shows this example with your own model filled in. Add <code>stream=True</code> to receive the response as it is generated.</p>
    <h2 id="curl">curl example</h2>
    <p>List the models your key can call.</p>
    <pre data-lang="Shell"><code>curl <span data-docs="origin">https://&lt;host&gt;</span>/api/v1/models \
  -H "Authorization: Bearer $ECE661_API_KEY"</code></pre>
    <div class="callout note" role="note"><p class="callout-title">Note</p><p>Listing models through the API needs a key with budget left. Before that, use the <a href="#/">My usage</a> page.</p></div>
    <h2 id="budget">Budget errors</h2>
    <p>When your Gemini budget is exhausted, the API rejects your requests with a budget error. After your group is funded, all members share one Gemini budget, so it runs out for every member at once.</p>
    <p>Check your remaining budget on <a href="#/">My usage</a> and <a href="#/group">My group</a>.</p>
  </template>

  <template id="doc-cli">
    <p class="docs-kicker">Guides</p>
    <h1>ece661 command</h1>
    <p class="docs-intro">The <code>ece661</code> command starts and stops TPU machines from your laptop and registers your SSH key.</p>
    <h2 id="requirements">Requirements</h2>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Requirement</th><th scope="col">Details</th></tr></thead>
      <tbody>
        <tr><td>Operating system</td><td>macOS, Linux, or WSL on Windows</td></tr>
        <tr><td>Tools</td><td><code>curl</code></td></tr>
        <tr><td>Permissions</td><td>No sudo. The installer does not change your system Python.</td></tr>
      </tbody>
    </table></div>
    <h2 id="install">Install</h2>
    <pre data-lang="Shell"><code>curl -fsSL <span data-docs="origin">https://&lt;host&gt;</span>/broker/cli/install.sh | sh</code></pre>
    <p>Open a new terminal when it finishes.</p>
    <div class="callout note" role="note"><p class="callout-title">Note</p><p>The installer adds <code>~/.local/bin</code> to your shell profile. Already open terminals do not see the change.</p></div>
    <h2 id="sign-in">Sign in</h2>
    <pre data-lang="Shell"><code>ece661 login</code></pre>
    <p>Paste the course key from your key email at the prompt. The key stays hidden as you type. It is saved privately on this computer. <code>ece661 logout</code> removes it.</p>
    <h2 id="ssh-key">Register your SSH key</h2>
    <p>You connect to TPU machines over SSH. Register your public key before your first session. Skip the first line if you already have <code>~/.ssh/id_ed25519.pub</code>.</p>
    <pre data-lang="Shell"><code>ssh-keygen -t ed25519
ece661 ssh-key add ~/.ssh/id_ed25519.pub</code></pre>
    <h2 id="commands">Commands</h2>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Command</th><th scope="col">What it does</th></tr></thead>
      <tbody>
        <tr><td><code>ece661 login</code></td><td>Asks for your course key at a hidden prompt and saves it on this computer</td></tr>
        <tr><td><code>ece661 login --key-file PATH</code></td><td>Reads the key from a file if you saved it to one</td></tr>
        <tr><td><code>ece661 logout</code></td><td>Removes the saved key from this computer</td></tr>
        <tr><td><code>ece661 ssh-key add [PATH]</code></td><td>Registers an SSH public key. PATH defaults to <code>~/.ssh/id_ed25519.pub</code>.</td></tr>
        <tr><td><code>ece661 compute start</code></td><td>Starts a TPU session. See the flags below.</td></tr>
        <tr><td><code>ece661 compute list</code></td><td>Lists your sessions</td></tr>
        <tr><td><code>ece661 compute stop ID</code></td><td>Stops a session</td></tr>
        <tr><td><code>ece661 update</code></td><td>Installs the newest version of the command</td></tr>
        <tr><td><code>ece661 update --check</code></td><td>Reports whether a newer version is out</td></tr>
        <tr><td><code>ece661 --version</code></td><td>Prints the installed version</td></tr>
      </tbody>
    </table></div>
    <h2 id="start-flags">Flags for compute start</h2>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Flag</th><th scope="col">Default</th><th scope="col">Description</th></tr></thead>
      <tbody>
        <tr><td><code>--shape</code></td><td><code>v6e-1</code></td><td>Machine shape. <code>v6e-1</code> is one TPU v6e chip.</td></tr>
        <tr><td><code>--hours</code></td><td><code>24</code></td><td>Session length, from 1 to 168 hours. Always set it.</td></tr>
        <tr><td><code>-y</code>, <code>--yes</code></td><td>Off</td><td>Reserves without the confirmation prompt</td></tr>
      </tbody>
    </table></div>
    <h2 id="update">Updating</h2>
    <p>The command checks for a new version once a day. When one is out, it prints a notice after your command finishes.</p>
    <pre data-lang="Shell"><code>ece661 update</code></pre>
    <p>This downloads the course installer and runs it again. Your saved key and SSH settings stay in place. Run <code>ece661 update --check</code> to see if a new version is out without installing it.</p>
    <p>If the update fails, it prints the install command. Run that command to reinstall by hand.</p>
    <p>To turn off the daily check, set <code>ECE661_NO_UPDATE_CHECK=1</code> in your shell profile.</p>
  </template>

  <template id="doc-tpu">
    <p class="docs-kicker">Guides</p>
    <h1>TPU sessions</h1>
    <p class="docs-intro">A session is a TPU machine that runs for the hours you request. It is deleted when those hours expire.</p>
    <h2 id="start">Start a session</h2>
    <p>Start a single-chip TPU machine for 4 hours:</p>
    <pre data-lang="Shell"><code>ece661 compute start --shape v6e-1 --hours 4</code></pre>
    <p>Before reserving resources, the command displays the cost and your group's remaining balance. If the reservation cost is $1 or more, the command asks <code>Reserve it? [y/N]</code>. Enter <code>y</code> to start.</p>
    <h2 id="limits">Limits</h2>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Limit</th><th scope="col">Value</th></tr></thead>
      <tbody>
        <tr><td>Machine shape</td><td><code>v6e-1</code>, one TPU v6e chip</td></tr>
        <tr><td>Session length</td><td>1 to 168 hours. The default is 24.</td></tr>
        <tr><td>Open sessions</td><td>At most 2 at a time</td></tr>
        <tr><td>Confirmation prompt</td><td>Reservations of $1 or more</td></tr>
        <tr><td>Idle cleanup</td><td>After 30 minutes of inactivity</td></tr>
        <tr><td>Boot grace period</td><td>The first 15 minutes after boot never count as idle</td></tr>
      </tbody>
    </table></div>
    <h2 id="connect">Connect</h2>
    <p>When the machine is ready, the command displays an SSH command such as <code>ssh ece661-1a2b3c4d</code>. You can use the same host name in VS Code Remote-SSH.</p>
    <h2 id="storage">Save your work</h2>
    <div class="callout warning" role="note"><p class="callout-title">Warning</p><p>The machine's disk is deleted with the machine. Keep checkpoints in your group bucket, mounted at <code>/mnt/group</code>.</p></div>
    <h2 id="stop">List and stop sessions</h2>
    <p>See your sessions and stop one when you finish:</p>
    <pre data-lang="Shell"><code>ece661 compute list
ece661 compute stop &lt;id&gt;</code></pre>
    <h2 id="spending-cap">Spending cap</h2>
    <p>Each start reserves the hourly rate multiplied by the hours you request. The reservation counts against your group's TPU share until the session ends.</p>
    <p>If a session request exceeds your group's cap, the system refuses it with <code>Not admitted</code> and a reason. Stop sessions you no longer need to free their reservation.</p>
    <h2 id="idle">Idle cleanup</h2>
    <p>A session is deleted after 30 minutes idle. Idle means no SSH session, no TPU work, and low load. The first 15 minutes after boot never count as idle.</p>
    <p>A running job counts as active work. To keep an idle machine running, create this file on it. Delete the file when you are finished.</p>
    <pre data-lang="Shell"><code>touch /tmp/ece661-busy</code></pre>
  </template>

  <template id="doc-groups">
    <p class="docs-kicker">Guides</p>
    <h1>Project groups and credit</h1>
    <p class="docs-intro">Your project credit belongs to your project group. You set up the group on the <a href="#/group">My group</a> page.</p>
    <h2 id="summary">At a glance</h2>
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Item</th><th scope="col">Value</th></tr></thead>
      <tbody>
        <tr><td>Group size</td><td>1 to 4 members</td></tr>
        <tr><td>Google credit</td><td><span data-docs="credit">$250</span> per group</td></tr>
        <tr><td>Split</td><td>Gemini API and TPU compute, in $10 steps</td></tr>
        <tr><td>Registration closes</td><td><span data-docs="deadline">[TBD]</span></td></tr>
        <tr><td>Nebius credit</td><td>$200 per student, pooled in the group</td></tr>
      </tbody>
    </table></div>
    <h2 id="form">Form a group</h2>
    <p>Open <a href="#/group">My group</a> and sign in with your course key.</p>
    <ol class="docs-steps">
      <li><p>One member creates the group and gets a join code. The code is shown only once, so copy it. The owner can make a new code with Rotate join code.</p></li>
      <li><p>Share the code with your teammates. Each teammate enters it, checks the group name and members, and joins.</p></li>
      <li><p>Split your group's <span data-docs="credit">$250</span> of Google credit between the Gemini API and TPU compute, in $10 steps. Any member can change the split.</p></li>
    </ol>
    <h2 id="deadline">Registration deadline</h2>
    <p>Registration closes on <span data-docs="deadline">[TBD]</span>. Until then, members can leave, and the owner can remove a member. After that, the group is locked and only a TA can change it.</p>
    <div class="callout warning" role="note"><p class="callout-title">Warning</p><p>If you are not in a group when registration closes, you have no project credit. Ask a TA to add you to a group.</p></div>
    <h2 id="using-credit">Using the credit</h2>
    <ul>
      <li>Every member calls the API with their own course key. All members spend from one shared group Gemini budget.</li>
      <li>TPU sessions draw on the group's TPU share.</li>
      <li>My group shows what the group has spent and what is left in each part.</li>
    </ul>
    <p>If your group needs a different split after registration closes, ask a TA.</p>
    <h2 id="nebius">Nebius</h2>
    <p>Each student also gets $200 of Nebius credit, pooled in the group. My group records how your group plans to split it between Nebius APIs and GPU compute. Details will follow.</p>
  </template>

  <template id="doc-troubleshooting">
    <p class="docs-kicker">Support</p>
    <h1>Troubleshooting</h1>
    <p class="docs-intro">Locate the message you see. Each section explains the cause and fix.</p>
    <h2 id="command-not-found">ece661: command not found</h2>
    <p><strong>Cause.</strong> The terminal was open before the install finished, so it does not know about <code>~/.local/bin</code>.</p>
    <p><strong>Fix.</strong> Open a new terminal. If it still fails, run the install command again.</p>
    <h2 id="login-first">Run ece661 login first</h2>
    <p><strong>Cause.</strong> No course key is saved on your computer.</p>
    <p><strong>Fix.</strong> Run <code>ece661 login</code> and paste the course key from your key email.</p>
    <h2 id="login-rejected">Login was not accepted</h2>
    <p><strong>Cause.</strong> The course server rejected the key you pasted. Your saved login remains unchanged.</p>
    <p><strong>Fix.</strong> Copy the whole key from your key email and run <code>ece661 login</code> again.</p>
    <h2 id="ssh-key-error">Could not read your SSH public key</h2>
    <p><strong>Cause.</strong> No public key exists at the path you specified or at <code>~/.ssh/id_ed25519.pub</code>.</p>
    <p><strong>Fix.</strong> Create a key, then register it.</p>
    <pre data-lang="Shell"><code>ssh-keygen -t ed25519
ece661 ssh-key add ~/.ssh/id_ed25519.pub</code></pre>
    <h2 id="not-admitted">Not admitted</h2>
    <p><strong>Cause.</strong> The server refused to start your session. The lines below the message state the reason, such as exceeding your group's TPU share.</p>
    <p><strong>Fix.</strong> Stop sessions you no longer need with <code>ece661 compute stop &lt;id&gt;</code>. Ask for fewer hours. Check what is left on <a href="#/group">My group</a>.</p>
    <h2 id="budget-error">The API returns a budget error</h2>
    <p><strong>Cause.</strong> Your Gemini budget is depleted. Once your group receives funding, this affects every member at once because you share one Gemini budget.</p>
    <p><strong>Fix.</strong> Check <a href="#/">My usage</a> and <a href="#/group">My group</a>. If your group needs a different split after registration closes, ask a TA.</p>
    <h2 id="session-gone">My session is gone</h2>
    <p><strong>Cause.</strong> The session ran out of hours or remained idle for 30 minutes. The machine and its disk were deleted.</p>
    <p><strong>Fix.</strong> Start a new session. Keep checkpoints in <code>/mnt/group</code> so the next session can use them. See <a href="#/docs/tpu#idle">Idle cleanup</a>.</p>
    <h2 id="broker-unreachable">Could not reach the course broker</h2>
    <p><strong>Cause.</strong> The command could not connect to the course server.</p>
    <p><strong>Fix.</strong> Check your internet connection and try again.</p>
    <div class="callout note" role="note"><p class="callout-title">Still stuck?</p><p>See <a href="#/docs/help">Getting help</a>.</p></div>
  </template>
